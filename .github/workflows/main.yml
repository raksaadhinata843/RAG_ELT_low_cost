name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_cik:
        description: 'Drop CIK or Blank it'
        required: false
        default: 'auto'
  schedule:
    - cron: '0 0 * * 5'

jobs:
  bronze:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Prepare bundle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -t src/
        cd src
        zip -r ../bundle.zip .
        cd ..

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Upload to S3
      run: |
        aws s3 cp bundle.zip s3://config-elt-bucket/deployments/lambda_ingest.zip

    - name: Update Lambda from S3
      run: |
        aws lambda update-function-code \
          --function-name lambda_ingest \
          --s3-bucket config-elt-bucket \
          --s3-key deployments/lambda_ingest.zip

    - name: Trigger Lambda Function
      run: |
        INPUT_CIK="${{ github.event.inputs.target_cik }}"
        if [[ -z "$INPUT_CIK" || "${INPUT_CIK,,}" == "auto" ]]; then
          echo '{"cik": "auto"}' > payload.json
        else
          jq -n --arg cik "$INPUT_CIK" '{cik: $cik}' > payload.json
        fi
        
        aws lambda invoke \
          --function-name lambda_ingest \
          --payload file://payload.json \
          --cli-binary-format raw-in-base64-out \
          response.json
        cat response.json


  silver:

    needs: bronze
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install DuckDB CLI
        run: |

          wget https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          chmod +x ./duckdb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t src/
          cd src

      - name: Run Casting & Transform
        env:
          motherduck_token: ${{ secrets.MD_TOKEN }}
        run: | 
         python src/silver.py

  gold:

    needs: silver
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
         pip install duckdb google-genai pandas

      - name: Install DuckDB CLI
        run: |

          wget https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          chmod +x ./duckdb

      - name: Run Translator
        env:
          motherduck_token: ${{ secrets.MD_TOKEN }}
        run: |
          ./duckdb md:Sec_DB < src/gold.sql
          
      - name: Run AI Insight Generator (The AI Engineer Part)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          motherduck_token: ${{ secrets.MD_TOKEN }}
        run: |
          python connection/connection-ai.py

      - name: Run ETL Dashboarding
        env:
          motherduck_token: ${{ secrets.MD_TOKEN }}
        run: |
          python update_data.py
