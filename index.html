<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profiles Dashboard</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400 tracking-tight">Sec_DB Dashboard</h1>
                <p class="text-gray-400 text-sm mt-1">Real-time data powered by MotherDuck & GitHub Actions</p>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                    ● Live Data
                </span>
            </div>
        </header>

        <!-- Grid layout untuk visualisasi -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Kolom Kiri: Chart -->
            <div class="lg:col-span-2 bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-white">Company Metrics Chart</h2>
                <div class="relative h-96 w-full">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>

            <!-- Kolom Kanan: Data Ringkasan / Log -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl flex flex-col h-[440px]">
                <h2 class="text-xl font-semibold mb-4 text-white">Raw Profiles Data</h2>
                <div class="overflow-y-auto flex-1 pr-2 scrollbar-thin">
                    <ul id="dataList" class="space-y-3">
                        <!-- Data dari JSON akan dirender di sini -->
                        <li class="text-gray-500 animate-pulse">Loading data...</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Logika Fetch Data & Render Chart -->
    <script>
        async function initDashboard() {
            try {
                // Fetch file JSON statis yang di-update oleh GitHub Actions
                const response = await fetch('data/metrics.json');
                if (!response.ok) throw new Error('Gagal mengambil file JSON');
                
                const data = await response.json();
                
                // 1. TAMPILKAN DI LIST (Kolom Kanan)
                const listContainer = document.getElementById('dataList');
                listContainer.innerHTML = ''; // bersihkan loading text
                
                if(data.length === 0) {
                    listContainer.innerHTML = '<li class="text-gray-500 text-center py-4">Tidak ada data tersedia</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'bg-gray-700/50 p-3 rounded-lg border border-gray-600/40 text-sm hover:border-emerald-500 transition-colors';
                    
                    // Menyesuaikan dengan kolom asli: perusahaan, kode_saham, sektor_industri
                    li.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-emerald-400">${item.perusahaan || 'N/A'}</span>
                            <span class="text-xs bg-gray-600 px-2 py-0.5 rounded text-gray-200 font-mono">${item.kode_saham || '---'}</span>
                        </div>
                        <div class="text-gray-400 text-xs mt-1">Sektor: ${item.sektor_industri || 'Unknown'}</div>
                    `;
                    listContainer.appendChild(li);
                });

                // 2. HITUNG AGREGASI UNTUK CHART (Kolom Kiri)
                // Karena ini data profil, kita hitung berapa banyak perusahaan di tiap sektor_industri
                const sectorCounts = {};
                data.forEach(item => {
                    const sektor = item.sektor_industri || 'Lainnya';
                    sectorCounts[sektor] = (sectorCounts[sektor] || 0) + 1;
                });

                const labels = Object.keys(sectorCounts);
                const chartValues = Object.values(sectorCounts);

                const ctx = document.getElementById('metricsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Jumlah Perusahaan per Sektor',
                            data: chartValues,
                            backgroundColor: 'rgba(52, 211, 153, 0.2)',
                            borderColor: 'rgba(52, 211, 153, 1)',
                            borderWidth: 2,
                            borderRadius: 6,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y', // Mengubah chart jadi horizontal biar teks sektor yang panjang tidak terpotong
                        scales: {
                            x: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                ticks: { color: '#9ca3af', stepSize: 1 }
                            },
                            y: {
                                grid: { display: false },
                                ticks: { color: '#f3f4f6' }
                            }
                        },
                        plugins: {
                            legend: { display: false } // Sembunyikan legend karena label sudah jelas
                        }
                    }
                });

            } catch (error) {
                console.error(error);
                document.getElementById('dataList').innerHTML = `
                    <li class="text-red-400 bg-red-950/40 border border-red-900 p-3 rounded-lg text-sm">
                        ⚠️ Gagal memuat data dashboard. Pastikan file data/metrics.json sudah ter-generate dengan benar.
                    </li>
                `;
            }
        }

        // Jalankan saat halaman dibuka
        initDashboard();
    </script>
</body>
</html>
